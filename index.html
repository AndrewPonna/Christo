<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Christo Ponnadurai | In Loving Memory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="overlay">
    <h1>Christo Ponnadurai</h1>
    <p>Forever in our hearts</p>
  </div>
</header>

<section class="container">
  <h2>His Life</h2>
  <p id="bio"></p>
</section>

<section class="container timeline">
  <h2>Life Journey</h2>
  <div class="timeline-item">Born in ...</div>
  <div class="timeline-item">Moved to ...</div>
  <div class="timeline-item">Built a life filled with...</div>
</section>

<section class="container">
  <h2>Eulogies</h2>

  <div class="card">
    <h3>Family</h3>
    <p>Add eulogy here...</p>
  </div>

  <div class="card">
    <h3>Friends</h3>
    <p>Add eulogy here...</p>
  </div>
</section>

<section class="container">
  <h2>Gallery</h2>
  <div class="gallery">
    <img src="images/photo1.jpg" />
    <img src="images/photo2.jpg" />
  </div>
</section>

<section class="container">
  <h2>Share a Memory</h2>

  <form id="form">
    <input id="name" placeholder="Your name" required />
    <textarea id="message" placeholder="Share your memory..." required></textarea>
    <button>Submit</button>
  </form>

  <div id="messages"></div>
</section>

<footer>
  <p>In loving memory of Christo Ponnadurai</p>
</footer>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Christo Ponnadurai Memorial</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#1a1714;--warm-dark:#2c2420;--parchment:#f5f0e8;--cream:#faf7f2;
      --gold:#b8914a;--gold-muted:#8a6a35;--stone:#6b5e52;--stone-light:#9c8e84;
      --divider:rgba(184,145,74,0.25);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#1e1a17;color:var(--parchment);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;}

    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
    .login-box{background:var(--warm-dark);border:1px solid var(--divider);padding:3rem;max-width:380px;width:100%;text-align:center;}
    .login-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--parchment);margin-bottom:.4rem;}
    .login-sub{font-size:.7rem;letter-spacing:.2em;color:var(--stone-light);text-transform:uppercase;margin-bottom:2rem;}
    .login-box input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--divider);padding:.8rem 1rem;color:var(--parchment);font-family:'Jost',sans-serif;font-size:1rem;outline:none;border-radius:0;margin-bottom:1rem;}
    .login-box input:focus{border-color:var(--gold);}
    #login-error{color:#c06060;font-size:.82rem;margin-top:.5rem;min-height:1.2em;}

    #admin-app{display:none;}
    header{background:var(--warm-dark);border-bottom:1px solid var(--divider);padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
    .header-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;}
    .header-title span{color:var(--gold);font-style:italic;}

    main{max-width:960px;margin:0 auto;padding:2.5rem 2rem;}

    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:2rem;}
    .stat-box{background:var(--warm-dark);border:1px solid var(--divider);padding:1.25rem 1.5rem;}
    .stat-num{font-family:'Cormorant Garamond',serif;font-size:2.5rem;color:var(--gold);line-height:1;}
    .stat-label{font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--stone-light);margin-top:.3rem;}

    .tabs{display:flex;gap:0;border-bottom:1px solid var(--divider);margin-bottom:2rem;}
    .tab{padding:.8rem 1.5rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--stone-light);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
    .tab:hover{color:var(--parchment);}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    .card-list{display:grid;gap:1rem;}
    .card{background:var(--warm-dark);border:1px solid var(--divider);padding:1.5rem 1.75rem;}
    .card.pending{border-left:3px solid var(--gold);}
    .card.approved{border-left:3px solid #3a7a4a;}
    .card-message{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--parchment);line-height:1.65;margin-bottom:.75rem;}
    .card-meta{font-size:.68rem;letter-spacing:.12em;color:var(--stone-light);text-transform:uppercase;margin-bottom:1rem;}
    .badge{display:inline-block;padding:.2em .6em;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;margin-left:.5rem;}
    .badge-pending{background:rgba(184,145,74,.15);color:var(--gold);}
    .badge-approved{background:rgba(58,122,74,.15);color:#6aaf7a;}
    .card-actions{display:flex;gap:.75rem;flex-wrap:wrap;}

    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border:none;transition:background .2s,opacity .2s;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .btn-primary{background:var(--gold-muted);color:var(--parchment);}
    .btn-primary:hover:not(:disabled){background:var(--gold);}
    .btn-danger{background:rgba(139,58,58,.35);color:#e08080;border:1px solid rgba(192,96,96,.3);}
    .btn-danger:hover:not(:disabled){background:rgba(139,58,58,.6);}
    .btn-neutral{background:rgba(255,255,255,.08);color:var(--stone-light);border:1px solid var(--divider);}
    .btn-neutral:hover:not(:disabled){background:rgba(255,255,255,.13);color:var(--parchment);}

    .empty-state{text-align:center;padding:4rem 2rem;color:var(--stone-light);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.1rem;}
    #toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--gold-muted);color:var(--parchment);padding:.75rem 1.25rem;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
    #toast.show{opacity:1;}
    .header-actions{display:flex;gap:.75rem;align-items:center;}
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Christo Ponnadurai Memorial</div>
    <input type="password" id="pw-input" placeholder="Enter admin password"
           onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn btn-primary" onclick="doLogin()" style="width:100%;justify-content:center;">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="admin-app">
  <header>
    <div class="header-title">Memorial Admin &nbsp;<span>— Christo Ponnadurai</span></div>
    <div class="header-actions">
      <a href="/" class="btn btn-neutral">← View Site</a>
      <button class="btn btn-neutral" onclick="logout()">Sign Out</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat-box"><div class="stat-num" id="stat-total">–</div><div class="stat-label">Total messages</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-pending">–</div><div class="stat-label">Awaiting review</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-approved">–</div><div class="stat-label">Published</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pending')">Pending Review</div>
      <div class="tab" onclick="switchTab('approved')">Published</div>
      <div class="tab" onclick="switchTab('all')">All Messages</div>
    </div>
    <div id="tab-pending"  class="tab-panel active"></div>
    <div id="tab-approved" class="tab-panel"></div>
    <div id="tab-all"      class="tab-panel"></div>
  </main>
</div>

<div id="toast"></div>

<script>
  let pw = '', all = [], currentTab = 'pending';

  async function doLogin() {
    const val = document.getElementById('pw-input').value;
    if (!val) { document.getElementById('login-error').textContent = 'Please enter a password.'; return; }
    const res = await fetch('/api/condolences?admin=true', { headers: { 'X-Admin-Password': val } });
    if (res.ok) {
      pw = val;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-app').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('login-error').textContent = 'Incorrect password.';
    }
  }

  function logout() {
    pw = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-app').style.display = 'none';
    document.getElementById('pw-input').value = '';
  }

  async function loadAll() {
    const res = await fetch('/api/condolences?admin=true', { headers: { 'X-Admin-Password': pw } });
    const data = await res.json();
    all = data.condolences || [];
    const pending  = all.filter(c => !c.approved).length;
    const approved = all.filter(c =>  c.approved).length;
    document.getElementById('stat-total').textContent    = all.length;
    document.getElementById('stat-pending').textContent  = pending;
    document.getElementById('stat-approved').textContent = approved;
    renderTab(currentTab);
  }

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['pending','approved','all'][i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    renderTab(name);
  }

  function renderTab(name) {
    let items = all;
    if (name === 'pending')  items = all.filter(c => !c.approved);
    if (name === 'approved') items = all.filter(c =>  c.approved);
    const container = document.getElementById('tab-' + name);
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">No messages here yet.</div>';
      return;
    }
    container.innerHTML = '<div class="card-list">' + items.map(c => `
      <div class="card ${c.approved ? 'approved' : 'pending'}" id="card-${c.id}">
        <div class="card-message">${esc(c.message)}</div>
        <div class="card-meta">
          <strong>${esc(c.name)}</strong>
          ${c.relation ? ' · ' + esc(c.relation) : ''}
          &nbsp;·&nbsp; ${fmtDate(c.timestamp)}
          <span class="badge ${c.approved ? 'badge-approved' : 'badge-pending'}">${c.approved ? 'Published' : 'Pending'}</span>
        </div>
        <div class="card-actions">
          ${!c.approved ? `<button class="btn btn-primary" onclick="approve('${c.id}')">✓ Approve &amp; Publish</button>` : ''}
          <button class="btn btn-danger" onclick="remove('${c.id}')">✕ Delete</button>
        </div>
      </div>
    `).join('') + '</div>';
  }

  async function approve(id) {
    const res = await fetch('/api/condolences?id=' + id, { method: 'PATCH', headers: { 'X-Admin-Password': pw } });
    if (res.ok) { toast('Message published ✓'); loadAll(); }
    else toast('Error — could not approve.', true);
  }

  async function remove(id) {
    if (!confirm('Delete this message permanently?')) return;
    const res = await fetch('/api/condolences?id=' + id, { method: 'DELETE', headers: { 'X-Admin-Password': pw } });
    if (res.ok) { toast('Message deleted.'); loadAll(); }
    else toast('Error — could not delete.', true);
  }

  function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? '#8b3a3a' : 'var(--gold-muted)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; }
</script>
</body>
</html>
